name: ich_bin_bereit
description: "Ich bin bereit - Dein persönlicher Aufgabenplaner"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  flutter_local_notifications: ^17.2.2
  shared_preferences: ^2.3.2
  uuid: ^4.4.0
  intl: ^0.20.2
  timezone: ^0.9.4
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  
  min_sdk_android: 21
